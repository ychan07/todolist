{% load static %}
<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - To Do List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chocolate+Classical+Sans&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>

<body>
    <main class="login">
        <h1 class="login__title">To Do List</h1>

        <form class="login__form" action="#" method="post">
            <div class="field">
                <label class="field__label" for="userId">아이디</label>
                <input class="field__input" type="text" id="userId" name="userId" autocomplete="username">
            </div>

            <div class="field">
                <label class="field__label" for="password">패스워드</label>
                <input class="field__input" type="password" id="password" name="password" autocomplete="current-password">
            </div>

            <button class="btn btn--primary login__submit" type="submit">로그인</button>
            <div style="margin-top: 16px; text-align: center;">
                <a href="/signup/" style="color: #225A98; text-decoration: none; font-size: 14px;">회원가입하러 가기</a>
            </div>
        </form>
    </main>
    <script src="{% static 'main.js' %}"></script>
</body>

</html>
