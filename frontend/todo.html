<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chocolate+Classical+Sans&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="todo-page">
    <header class="todo-header">
        <h1 class="todo-header__title">To Do List</h1>
        <div class="todo-header__account">
            <!--사용자 로고 쪽 svg이미지, ai로 만듬-->
            <svg class="todo-header__avatar" width="28" height="28" viewBox="0 0 28 28" fill="none">
                <circle cx="14" cy="14" r="13" stroke="#6B7280" stroke-width="1.5" />
                <circle cx="14" cy="11" r="4" stroke="#6B7280" stroke-width="1.5" />
                <path d="M6.5 22.5c1.8-3.2 4.5-4.8 7.5-4.8s5.7 1.6 7.5 4.8" stroke="#6B7280" stroke-width="1.5"
                    stroke-linecap="round" />
            </svg>
            <!--사용자 로고 쪽 svg이미지, ai로 만듬-->

            <span class="todo-header__name">정유찬님</span>
            <span class="todo-header__seperater">/</span>
            <a class="todo-header__logout" href="#">로그아웃</a>
        </div>
    </header>

    <main class="todo-board">
        <section class="todo-column" data-column="pending">
            <div class="todo-column__head">
                <h2 class="todo-column__title">to do</h2>
                <button class="todo-column__add" type="button">
                    <!-- +버튼 이미지, ai로 만듬-->
                    <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                        <circle cx="14" cy="14" r="13" stroke="#225A98" stroke-width="1.5" />
                        <path d="M14 9v10M9 14h10" stroke="#225A98" stroke-width="1.5" stroke-linecap="round" />
                    </svg>
                    <!-- +버튼 이미지, ai로 만듬-->
                </button>
            </div>
            <hr class="todo-column__divider" />
            <ul class="todo-list">
                <li class="todo-item">
                    <div class="todo-item__body">
                        <span class="todo-item__title">테스크1</span>
                        <span class="todo-item__due">기간</span>
                    </div>
                    <button class="todo-item__check" type="button"></button>
                </li>
            </ul>
        </section>

        <section class="todo-column" data-column="completed">
            <div class="todo-column__head">
                <h2 class="todo-column__title">end to do</h2>
            </div>
            <hr class="todo-column__divider" />
            <ul class="todo-list">
                <li class="todo-item todo-item--done">
                    <div class="todo-item__body">
                        <span class="todo-item__title">테스크2</span>
                    </div>
                    <button class="todo-item__check todo-item__check--done" type="button">
                        <!-- 버튼 이미지, ai로 만듬-->
                        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                            <path d="M3 7.2l2.8 2.8L11 4" stroke="#fff" stroke-width="1.8" stroke-linecap="round"
                                stroke-linejoin="round" />
                        </svg>
                        <!-- 버튼 이미지, ai로 만듬-->
                    </button>
                </li>
            </ul>
        </section>

        <section class="todo-column" data-column="failed">
            <div class="todo-column__head">
                <h2 class="todo-column__title">not end to do</h2>
            </div>
            <hr class="todo-column__divider" />
            <ul class="todo-list">
                <li class="todo-item todo-item--failed">
                    <div class="todo-item__body">
                        <span class="todo-item__title">테스크3</span>
                    </div>
                    <button class="todo-item__check" type="button"></button>
                </li>
            </ul>
        </section>
    </main>
    <!--end to do에서 todo로 옮길 시에 뜨는 모달(재황용 예정)-->
    <div class="todo-modal" id="todoModal" hidden>
        <div class="todo-modal__backdrop" data-modal-dismiss></div>
        <div class="todo-modal__dialog">
            <p class="todo-modal__title" id="todoModalTitle"></p>
            <p class="todo-modal__desc" id="todoModalDesc"></p>
            <div class="todo-modal__actions">
                <button class="todo-modal__btn" type="button" data-modal-dismiss>아니오</button>
                <button class="todo-modal__btn" type="button" data-modal-confirm>예</button>
            </div>
        </div>
    </div>

    <!--상세보기 모달-->
    <div class="detail-modal" id="detailModal" hidden>
        <div class="detail-modal__backdrop" data-detail-close></div>
        <div class="detail-modal__dialog">
            <div class="detail-modal__top">
                <button class="detail-modal__back" type="button" data-detail-close>
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <path d="M12.5 4.5L7 10l5.5 5.5" stroke="#90CAF9" stroke-width="1.8" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                </button>
                <span class="detail-modal__badge">TO Do</span>
            </div>

            <div class="detail-modal__field">
                <div class="detail-modal__label">
                    <span class="detail-modal__dot"></span>
                    <span>to do</span>
                </div>
                <p class="detail-modal__value" id="detailTitle"></p>
            </div>

            <div class="detail-modal__field">
                <div class="detail-modal__label">
                    <span class="detail-modal__dot"></span>
                    <span>기한</span>
                </div>
                <p class="detail-modal__value" id="detailDue"></p>
            </div>

            <div class="detail-modal__actions">
                <button class="detail-modal__edit" type="button">수정</button>
                <button class="detail-modal__delete" type="button" id="detailDeleteBtn">삭제</button>
            </div>
        </div>
    </div>

    <!--삭제 확인 모달-->
    <div class="todo-modal" id="deleteModal" hidden>
        <div class="todo-modal__backdrop" data-delete-cancel></div>
        <div class="todo-modal__dialog">
            <p class="todo-modal__title">정말로 삭제하시겠습니까?</p>
            <p class="todo-modal__desc">삭제후에는 복구하기 어렵습니다.</p>
            <div class="todo-modal__actions">
                <button class="todo-modal__btn todo-modal__btn--muted" type="button" data-delete-cancel>취소</button>
                <button class="todo-modal__btn todo-modal__btn--danger" type="button" data-delete-confirm>삭제하기</button>
            </div>
        </div>
    </div>

    <!--추가 모달-->
    <div class="edit-modal" id="addModal" hidden>
        <div class="edit-modal__backdrop" data-add-cancel></div>
        <div class="edit-modal__dialog">
            <button class="edit-modal__close" type="button" data-add-cancel>
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                    <path d="M4 4l8 8M12 4l-8 8" stroke="#F87171" stroke-width="1.8" stroke-linecap="round" />
                </svg>
            </button>

            <label class="edit-modal__label edit-modal__label--dot" for="addTitleInput">TO DO 입력</label>
            <input class="edit-modal__input" id="addTitleInput" type="text" />

            <label class="edit-modal__label edit-modal__label--dot" for="addDueInput">TO DO 기한 설정</label>
            <div class="edit-modal__date">
                <input class="edit-modal__input edit-modal__input--date" id="addDueInput" type="date" />
                <svg class="edit-modal__chevron" width="14" height="14" viewBox="0 0 14 14" fill="none">
                    <path d="M3.5 5.25L7 8.75l3.5-3.5" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
            </div>

            <div class="edit-modal__actions">
                <button class="edit-modal__btn" type="button" data-add-cancel>취소</button>
                <button class="edit-modal__btn" type="button" data-add-save>저장 후 닫기</button>
            </div>
        </div>
    </div>

    <!--수정 모달-->
    <div class="edit-modal" id="editModal" hidden>
        <div class="edit-modal__backdrop" data-edit-cancel></div>
        <div class="edit-modal__dialog">
            <button class="edit-modal__close" type="button" data-edit-cancel>
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                    <path d="M4 4l8 8M12 4l-8 8" stroke="#F87171" stroke-width="1.8" stroke-linecap="round" />
                </svg>
            </button>

            <label class="edit-modal__label" for="editTitleInput">TO DO 입력</label>
            <input class="edit-modal__input" id="editTitleInput" type="text" />

            <label class="edit-modal__label" for="editDueInput">TO DO 기한 설정</label>
            <input class="edit-modal__input" id="editDueInput" type="text" />

            <div class="edit-modal__actions">
                <button class="edit-modal__btn" type="button" data-edit-cancel>취소</button>
                <button class="edit-modal__btn" type="button" data-edit-save>저장 후 닫기</button>
            </div>
        </div>
    </div>

    <script src="todo.js"></script>
</body>

</html>
